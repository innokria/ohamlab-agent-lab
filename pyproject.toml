[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ohamlab-agent-lab"
version = "0.1.0"
description = "Standalone agent runtime with REST, MCP, Gradio, Redis and persistent file storage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3"
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "mcp>=1.9,<2",
  "redis>=5.0,<7"
]
ui = ["gradio>=5.0,<6"]
all = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "mcp>=1.9,<2",
  "redis>=5.0,<7",
  "gradio>=5.0,<6"
]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
